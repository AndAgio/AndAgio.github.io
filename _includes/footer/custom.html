<script>
    function copyBibtex(button) {
    const code = button.parentElement.querySelector("code").innerText;

    navigator.clipboard.writeText(code).then(() => {
        const old = button.innerText;
        button.innerText = "Copied!";
        setTimeout(() => button.innerText = old, 1200);
    });
    }
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const keywordMap = {
    "Neuro-Symbolic": { words: ["logic", "symbolic", "reasoning"], class: "tag-ns" },
    "Security": { words: ["attack", "intrusion", "threat", "privacy"], class: "tag-sec" },
    "Machine Learning": { words: ["learning", "model", "training", "dataset"], class: "tag-ml" },
    "Graph": { words: ["graph", "gnn"], class: "tag-graph" },
    "NLP": { words: ["language", "text", "llm"], class: "tag-nlp" },
    "xAI": { words: ["explain", "interpret"], class: "tag-xai" },
    "Optimization": { words: ["loss", "gradient", "minimization"], class: "tag-opt" }
  };

  document.querySelectorAll(".pub-tags").forEach(el => {

    const text = el.dataset.abstract.toLowerCase();
    const tags = [];

    for (const [name, obj] of Object.entries(keywordMap)) {
      if (obj.words.some(w => text.includes(w))) {
        tags.push(`<span class="tag ${obj.class}">${name}</span>`);
      }
    }

    el.innerHTML = tags.join(" ");
  });

});
</script>
