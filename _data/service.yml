# Service page (_pages/service.html). Structure modelled on
# giovanniapruzzese.com/service; plain CV-style rows (Andrea, 2026-11-15).
# Program committee and reviewer rows: short name on the left, full name,
# years on the right. Chair and community rows use their own layouts (below).
# Source: the CV (master record) and brand/profile.md.
#
# Each item: acronym (short name shown on the left; every item has one),
# role (optional), name, url (optional, links the name), years (any order;
# consecutive years are shown as a range, e.g. 2023–2025), ongoing (optional,
# true -> "2026–ongoing"), note (optional, Markdown, second line).
# Sections have an icon (Font Awesome 6 solid name, e.g. "brain"), a colour
# (amber | blue | purple | green | red | grey), an optional layout, and either
# items or groups of items (groups have a label and an icon).
# Layouts: "event"    -> "Role @ ACRONYM" (acronym linked to url), the full
#                        event name, then `where` (Markdown: co-location,
#                        city, dates). Organizing / chair roles always get a url.
#          "position" -> `title` (Markdown, with the link), `institution`
#                        (shown with an icon), `description` (small print).
#          (none)     -> full name (linked if url), note below.

intro: >-
  I review 40+ papers a year for machine learning, AI and security venues, and help organize
  workshops at the intersection of these communities.

sections:
  - id: chairs
    title: Organization & Chair Roles
    icon: sitemap
    color: amber
    layout: event
    # Facts from each event's own site (checked 2026-11-15). HotDiSec is left
    # unnumbered on purpose (Andrea, 2026-11-15), although brand/profile.md
    # says it is officially the 1st edition (the CV says "1st").
    items:
      - role: Organizer
        acronym: HotDiSec
        url: "https://hotdisec.github.io/website_2026/"
        name: International Workshop on Hot Topics at the Intersection of Distributed Machine Learning and Security
        where: Co-located with [ESORICS 2026](https://esorics2026.org/) in Rome, Italy · 14–18 September 2026
        years: ["2026"]
      - role: Organizer
        acronym: ANSyA
        url: "https://ansya-workshop.github.io/2025/"
        name: 1st International Workshop on Advanced Neuro-Symbolic Applications
        where: Co-located with [ECAI 2025](https://ecai2025.org/) in Bologna, Italy · 25–30 October 2025
        years: ["2025"]
      - role: Organizer
        acronym: HotDiML
        url: "https://hotdiml.github.io/HotDiML2025/"
        name: 1st Workshop on Hot Topics in Distributed Machine Learning
        where: Co-located with [IEEE ICDCS 2025](https://icdcs2025.icdcs.org/) in Glasgow, Scotland, UK · 20–23 July 2025
        years: ["2025"]
      - role: Web Chair
        acronym: ECAI
        url: "https://ecai2025.org/"
        name: 28th European Conference on Artificial Intelligence
        where: Bologna, Italy · 25–30 October 2025
        years: ["2025"]
      - role: Publicity Chair
        acronym: EXTRAAMAS
        url: "https://extraamas.histlab.hevs.ch/archive-2024.html"
        name: 6th International Workshop on EXplainable and TRAnsparent AI and Multi-Agent Systems
        where: Co-located with [AAMAS 2024](https://www.ifaamas.org/AAMAS/aamas2024/) in Auckland, New Zealand · 6–7 May 2024
        years: ["2024"]

