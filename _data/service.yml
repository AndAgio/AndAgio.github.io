        years: ["2026"]
        ongoing: true
        description: >-
          The PostDoc Network represents the postdoctoral researchers of TU Delft. As a committee
          member, I work to give postdocs a voice in their departments, faculties and the higher
          governing bodies of the university, bringing their perspective into the decisions that
          shape their positions and careers.
      - title: >-
          Participant in the
          [TU Delft Generative AI Workgroup](https://www.tudelft.nl/ellis-delft-unit/programmes/tu-delft-generative-ai-workgroup)
        institution: TU Delft
        years: ["2026"]
        ongoing: true
        description: >-
          I take part in the workgroup to help shape TU Delft's university-wide stance and agenda on
          generative AI in research. The workgroup is one of the ELLIS Delft Unit programmes.
