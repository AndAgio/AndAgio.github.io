# Research themes for the Publications page (filter buttons + tags on each paper).
# The five themes cover the research areas in the bio. A paper lists theme ids under `topics:` in
# _data/publications.yml; free-text `keywords:` are shown on the card but are not filters.
# The order here is the order of the buttons and tags.
# Icons: emoji, like everywhere else on the site (Andrea, 2026-11-16).
# Colours: shades of the site blue (palette in _sass/_custom.scss), darkest first;
# written as CSS variables so they also switch in dark mode.

- id: privacy
  name: Privacy & Memorization
  kind: theme
  emoji: "🔒"
  color: "var(--b900)"

- id: neurosymbolic
  name: Neuro-Symbolic & Explainable AI
  kind: theme
  emoji: "🧩"
  color: "var(--b800)"

- id: distributed
  name: Distributed & Federated Learning
  kind: theme
  emoji: "🌐"
  color: "var(--b700)"

- id: efficient
  name: Efficient Learning
  kind: theme
  emoji: "⚡"
  color: "var(--b600)"

- id: security
  name: Cybersecurity
  kind: theme
  emoji: "🛡️"
  color: "var(--b500)"
