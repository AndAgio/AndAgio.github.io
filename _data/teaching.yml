# Teaching page (_pages/teaching.html; was "Supervision & Teaching", renamed by
# Andrea 2026-11-16). Same headings as the Service page, entries as compact
# cards in two columns.
# Students are named as on other TU Delft group pages. Check with a student
# before adding them while their thesis is still ongoing.
#
# Card fields (all optional except one of name / role):
#   name      -> bold header (e.g. the student)
#   role, org -> header "Role @ Org" instead of name (org linked if url)
#   badge     -> small amber badge after the header (honours, e.g. Cum laude)
#   title     -> italic line (thesis title; linked if link)
#   text      -> plain line
#   meta      -> small grey line, starting with 🏛️ (the institution)
#   when      -> right-hand column

