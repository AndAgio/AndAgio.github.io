# CV page (_pages/cv.html; named curriculum.yml because the template's unused
# _data/cv.json already takes "cv"). Source: the CV repo (cv/main.tex, v1.4, the master
# record) and brand/profile.md. Layout modelled on giovanniapruzzese.com/cv,
# in the same rows as the Service page (_includes/service-list.html).
# When the CV changes: update this file AND replace files/research_cv_agiollo.pdf
# with a fresh public build (see the public-image skill, references/cv.md).
#
# Left out on purpose (they are in the PDF): the profile paragraph (the home
# page has the bio), the NWO Veni application (decision pending), and the
# lists already on other pages (publications, talks, supervision, service).
#
# Fields as in _data/service.yml, plus:
#   org     -> the "@ ..." part of the header (defaults to acronym)
#   period  -> free text for the right-hand column (e.g. "Oct 2026–ongoing")
#   description -> small print under the row

