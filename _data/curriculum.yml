  - id: positions
    title: Academic Positions
    icon: briefcase
    color: blue
    layout: event
    items:
      - role: Postdoctoral Researcher
        org: TU Delft
        url: "https://www.tudelft.nl/en/"
        name: Multimedia Computing Group, Faculty of EEMCS
        where: Delft, the Netherlands
        period: Oct 2026–ongoing
        description: >-
          Trustworthy and privacy-preserving graph learning, building on my work on memorization and
          loss sharpness of machine learning models. Working with Dr. Megha Khosla.
      - role: Postdoctoral Researcher
        org: TU Delft
        url: "https://www.tudelft.nl/en/"
        name: Cybersecurity Group, Faculty of EEMCS
        where: Delft, the Netherlands
        period: Oct 2024–Sep 2026
        description: >-
          Trustworthy learning systems for cybersecurity: privacy and robustness of neuro-symbolic and
          deep models against membership inference and backdoor attacks, and neuro-symbolic intrusion
          detection grounded in structured threat knowledge such as attack graphs. Supervised three
          MSc theses in this line.
      - role: Visiting Research Scholar
        org: Purdue University
        url: "https://www.purdue.edu/"
        where: West Lafayette, Indiana, USA
        period: Aug 2023–Nov 2023
        description: >-
          Neuro-symbolic integration and the properties of neural network training, such as
          memorization and the flatness of minima.
      - role: Visiting Research Scholar
        org: TU Delft
        url: "https://www.tudelft.nl/en/"
        name: Interactive Intelligence Group
        where: Delft, the Netherlands
        period: Oct 2022–Feb 2023
        description: >-
          Explainable AI techniques to extract knowledge from a trained large language model used for
          text classification and morality alignment.

