# Recent News, shown on the home page (_pages/about.md).
#
# How it works
# - Add a new item ANYWHERE in this list: the page sorts items by `date`, newest first.
# - The home page shows all items in a scrollable box sized to the 10 newest
#   (visible=10 in _pages/about.md); older ones are reached by scrolling inside it.
# - `date` decides the order. Only the month and year are shown. Use the real day when
#   you know it, so two items from the same month keep the right order.
# - `text` is Markdown: links, *italics*, **bold** and emoji work.
# - `gallery` is optional. Photos are shown only if the files exist in `folder`,
#   so a gallery can be prepared before the photos are uploaded. The caption is
#   shown only once every listed photo is there. `size: large` shows bigger photos
#   (good for a single group photo). Clicking a photo opens it full size.

- date: 2026-11-15
  text: >-
    Our paper [Beyond the Syntax: Do Security Experts Trust LLMs for NIDS Rule Engineering?](https://doi.org/10.1145/3847352.3848108)
    was selected as one of 8 spotlight papers at [AISec 2026](https://aisec.cc/), co-located with ACM CCS 2026.
    A reality check on LLM-written intrusion detection rules: they look right but are often too broad, so the experts in
    our user study see LLMs as drafting and checking aids rather than autonomous rule writers.

- date: 2026-11-12
  text: >-
    Took part in the [TU Delft Generative AI Workgroup](https://www.tudelft.nl/ellis-delft-unit/programmes/tu-delft-generative-ai-workgroup),
    helping to shape the university-wide stance and agenda on generative AI in research. The workgroup brings together
    researchers from across TU Delft's faculties to unify and amplify the university's efforts in generative AI.

- date: 2026-10-16
  text: >-
    Honored and proud to have been invited to the
    ["Advancing Testability and Verifiability of CPS with Neurosymbolic and Large Language Models"](https://www.dagstuhl.de/26421)
    Dagstuhl Seminar, held on 11–16 October at Schloss Dagstuhl. This seminar brought together experts in formal methods,
    AI, robotics and software engineering to explore how neuro-symbolic AI and LLMs can help test and verify the
    learning-enabled cyber-physical systems used in transportation, healthcare and robotics.
  gallery:
    title: Bits from Dagstuhl 2026
    folder: /images/events/dagstuhl_2026/
    size: large
    photos:
      - file: 1.jpg
        alt: Group photo of the participants of Dagstuhl Seminar 26421 on the steps of Schloss Dagstuhl
    caption: Seminar participants at Schloss Dagstuhl. Photo © Schloss Dagstuhl – LZI GmbH, CC BY-NC-ND.

- date: 2026-10-01
  text: >-
    Joined the [Multimedia Computing Group](https://www.tudelft.nl/en/ewi/over-de-faculteit/afdelingen/intelligent-systems/multimedia-computing)
    at TU Delft, where I work with [Dr. Megha Khosla](https://khosla.github.io/) on trustworthy and privacy-preserving graph learning.

- date: 2026-09-24
  text: >-
