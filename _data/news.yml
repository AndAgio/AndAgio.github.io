- date: 2026-04-24
  text: >-
    Attending ICLR 2026 in Rio de Janeiro (Brazil 🇧🇷) and presenting our paper
    ["Membership Privacy Risks of Sharpness Aware Minimization"](https://proceedings.iclr.cc/paper_files/paper/2026/hash/82f77023563b21fbd423b2d9b165c281-Abstract-Conference.html).
    The paper is a cautionary tale on flatter minima and sharper privacy risks, showing how SAM's improved generalization
    comes at the cost of higher vulnerability to membership inference attacks.
  gallery:
    title: Bits from ICLR 2026
    folder: /images/conferences/iclr_2026/
    photos:
      - file: 1.jpeg
        alt: TU Delft researchers at ICLR 2026
      - file: 2.jpeg
        alt: Discussing the paper at ICLR 2026
      - file: 3.jpeg
        alt: Our paper poster at ICLR 2026
    caption: (Leftmost) TU Delft @ ICLR, (Middle) Paper Discussion, (Rightmost) Our Paper Poster.

