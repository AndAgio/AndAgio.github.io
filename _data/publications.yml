      title     = {{EneA-FL}: Energy-aware Orchestration for Serverless Federated Learning},
      author    = {Agiollo, Andrea and Bellavista, Paolo and Mendula, Matteo and Omicini, Andrea},
      journal   = {Future Generation Computer Systems},
      volume    = {154},
      pages     = {219--234},
      year      = {2024},
      publisher = {Elsevier},
