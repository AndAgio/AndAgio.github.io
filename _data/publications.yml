- id: kbs2025
  type: journal
  year: 2025
  topics: [neurosymbolic]
  keywords: ["Large Language Models", "Ontologies", "Knowledge graphs", "Knowledge instantiation"]
  title: "Large Language Models as Oracles for Instantiating Ontologies with Domain-Specific Knowledge"
  authors: ["Giovanni Ciatto", "Andrea Agiollo", "Matteo Magnini", "Andrea Omicini"]
  venue: "Knowledge-Based Systems, 2025"
  venue_full: "Elsevier Knowledge-Based Systems, vol. 310"
  thumb: "/images/paper_thumbnails/kbs2025_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    preprint: "https://arxiv.org/abs/2404.04108"
    code: "https://github.com/Chistera4-Expectation/kg-filler"
    doi: "https://doi.org/10.1016/j.knosys.2024.112940"
  abstract: "Background: Endowing intelligent systems with semantic data commonly requires designing and instantiating ontologies with domain-specific knowledge. Especially in the early phases, those activities are typically performed manually by human experts possibly leveraging on their own experience. The resulting process is therefore time-consuming, error-prone, and often biased by the personal background of the ontology designer. Objective: To mitigate that issue, we propose a novel domain-independent approach to automatically instantiate ontologies with domain-specific knowledge, by leveraging on large language models (LLMs) as oracles. Methods: Starting from (i) an initial schema composed by inter-related classes and properties and (ii) a set of query templates, our method queries the LLM multiple times, and generates instances for both classes and properties from its replies. Thus, the ontology is automatically filled with domain-specific knowledge, compliant to the initial schema. As a result, the ontology is quickly and automatically enriched with manifold instances, which experts may consider to keep, adjust, discard, or complement according to their own needs and expertise. Contribution: We formalise our method in general way and instantiate it over various LLMs, as well as on a concrete case study . We report experiments rooted in the nutritional domain where an ontology of food meals and their ingredients is automatically instantiated from scratch, starting from a categorisation of meals and their relationships. There, we analyse the quality of the generated ontologies and compare ontologies attained by exploiting different LLMs. Experimentally, our approach achieves a quality metric that is up to five times higher than the state-of-the-art, while reducing erroneous entities and relations by up to ten times. Finally, we provide a SWOT analysis of the proposed method."
  bibtex: |-
    @article{CiattoLlm2025,
      title     = {Large Language Models as Oracles for Instantiating Ontologies with Domain-Specific Knowledge},
      author    = {Ciatto, Giovanni and Agiollo, Andrea and Magnini, Matteo and Omicini, Andrea},
      journal   = {Knowledge-Based Systems},
      volume    = {310},
      pages     = {112940},
      year      = {2025},
      publisher = {Elsevier},
      doi       = {10.1016/j.knosys.2024.112940}
    }

- id: kdd2024
  type: conference
  year: 2024
  topics: [privacy, efficient]
  keywords: ["Memorization", "Loss surface geometry", "Dataset pruning", "Data summarization", "Efficient training"]
  title: "Approximating Memorization Using Loss Surface Geometry for Dataset Pruning and Summarization"
  authors: ["Andrea Agiollo*", "Young In Kim*", "Rajiv Khanna"]
  equal: true
  venue: "KDD 2024"
  venue_full: "30th ACM SIGKDD Conference on Knowledge Discovery and Data Mining"
  thumb: "/images/paper_thumbnails/kdd2024_thumb.png"
  thumb_alt: "First page of the KDD 2024 paper"
  links:
    pdf: "/files/papers/kdd2024.pdf"
    code: "https://github.com/AndAgio/SAMIS"
    doi: "https://doi.org/10.1145/3637528.3671985"
  abstract: "The sustainable training of modern neural network models represents an open challenge. Several existing methods approach this issue by identifying a subset of relevant data samples from the full training data to be used in model optimization with the goal of matching the performance of the full data training with that of the subset data training. Our work explores using memorization scores to find representative and atypical samples. We demonstrate that memorization-aware dataset summarization improves the subset construction performance. However, computing memorization scores is notably resource-intensive. To this end, we propose a novel method that leverages the discrepancy between sharpness-aware minimization and stochastic gradient descent to capture data points atypicality. We evaluate our metric over several efficient approximation functions for memorization scores (namely proxies), empirically showing superior correlation and effectiveness. We explore the causes behind our approximation quality, highlighting how typical data points trigger a flatter loss landscape compared to atypical ones. Extensive experiments confirm the effectiveness of our proxy for dataset pruning and summarization tasks, surpassing state-of-the-art approaches both on canonical setups, where atypical data points benefit performance, and few-shot learning scenarios, where atypical data points can be detrimental."
  bibtex: |-
    @inproceedings{agiollo2024memorization,
      title     = {Approximating Memorization Using Loss Surface Geometry for Dataset Pruning and Summarization},
      author    = {Agiollo, Andrea and Kim, Young In and Khanna, Rajiv},
      booktitle = {Proceedings of the 30th ACM SIGKDD Conference on Knowledge Discovery and Data Mining (KDD '24)},
      pages     = {17--28},
      year      = {2024},
      publisher = {ACM},
      doi       = {10.1145/3637528.3671985}
    }

- id: jaamas2024
  type: journal
  year: 2024
  topics: [neurosymbolic, efficient]
  keywords: ["Explainable AI", "Large Language Models", "Logic programs", "Post-hoc explanations", "Natural language processing"]
  title: "From Large Language Models to Small Logic Programs: Building Global Explanations from Disagreeing Local Post-hoc Explainers"
  authors: ["Andrea Agiollo", "Luciano Cavalcante Siebert", "Pradeep K. Murukannaiah", "Andrea Omicini"]
  venue: "JAAMAS, 2024"
  venue_full: "Autonomous Agents and Multi-Agent Systems (Springer), vol. 38, no. 2"
  thumb: "/images/paper_thumbnails/jaamas2024_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "https://link.springer.com/content/pdf/10.1007/s10458-024-09663-8.pdf"
    code: "https://github.com/AndAgio/SKE_NLP"
    results: "https://github.com/AndAgio/GELPE"
    doi: "https://doi.org/10.1007/s10458-024-09663-8"
  abstract: "The expressive power and effectiveness of large language models (LLMs) is going to increasingly push intelligent agents towards sub-symbolic models for natural language processing (NLP) tasks in human–agent interaction. However, LLMs are characterised by a performance vs. transparency trade-off that hinders their applicability to such sensitive scenarios. This is the main reason behind many approaches focusing on local post-hoc explanations, recently proposed by the XAI community in the NLP realm. However, to the best of our knowledge, a thorough comparison among available explainability techniques is currently missing, as well as approaches for constructing global post-hoc explanations leveraging the local information. This is why we propose a novel framework for comparing state-of-the-art local post-hoc explanation mechanisms and for extracting logic programs surrogating LLMs. Our experiments—over a wide variety of text classification tasks—show how most local post-hoc explainers are loosely correlated, highlighting substantial discrepancies in their results. By relying on the proposed novel framework, we also show how it is possible to extract faithful and efficient global explanations for the original LLM over multiple tasks, enabling explainable and resource-friendly AI techniques."
  bibtex: |-
    @article{AgiolloJaamas2024,
      title     = {From Large Language Models to Small Logic Programs: Building Global Explanations from Disagreeing Local Post-hoc Explainers},
      author    = {Agiollo, Andrea and Siebert, Luciano Cavalcante and Murukannaiah, Pradeep K. and Omicini, Andrea},
      journal   = {Autonomous Agents and Multi-Agent Systems},
      volume    = {38},
      number    = {2},
      pages     = {32},
      year      = {2024},
      publisher = {Springer},
