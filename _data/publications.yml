    code: "https://github.com/AndAgio/GNN_4_IFA"
    doi: "https://doi.org/10.1109/EuroSP57164.2023.00043"
  abstract: "In the context of Information-Centric Networking, Interest Flooding Attacks (IFAs) represent a new and dangerous sort of distributed denial of service. Since existing proposals targeting IFAs mainly focus on local information, in this paper we propose GNN4IFA as the first mechanism exploiting complex non-local knowledge for IFA detection by leveraging Graph Neural Networks (GNNs) handling the overall network topology.In order to test GNN4IFA, we collect SPOTIFAI, a novel dataset filling the current lack of available IFA datasets by covering a variety of IFA setups, including ~40 heterogeneous scenarios over three network topologies. We show that GNN4IFA performs well on all tested topologies and setups, reaching over 99% detection rate along with a negligible false positive rate and small computational costs. Overall, GNN4IFA overcomes state-of-the-art detection mechanisms both in terms of raw detection and flexibility, and – unlike all previous solutions in the literature – also enables the transfer of its detection on network topologies different from the one used in its design phase."
  bibtex: |-
    @inproceedings{gnn4ifa-eurosp2023,
      title     = {{GNN4IFA}: Interest Flooding Attack Detection with Graph Neural Networks},
      author    = {Agiollo, Andrea and Bardhi, Enkeleda and Conti, Mauro and Lazzeretti, Riccardo and Losiouk, Eleonora and Omicini, Andrea},
      booktitle = {2023 IEEE 8th European Symposium on Security and Privacy (EuroS\&P)},
      pages     = {615--630},
      year      = {2023},
      publisher = {IEEE},
      doi       = {10.1109/EuroSP57164.2023.00043}
    }

- id: fedcsis2023
  type: conference
  year: 2023
  topics: [neurosymbolic]
  keywords: ["Neuro-symbolic integration", "Trustworthy AI", "Evaluation metrics", "Interpretability"]
  title: "Measuring Trustworthiness in Neuro-Symbolic Integration"
  authors: ["Andrea Agiollo", "Andrea Omicini"]
  venue: "FedCSIS 2023"
  venue_full: "18th Conference on Computer Science and Intelligence Systems"
  thumb: "/images/paper_thumbnails/fedcsis2023_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "https://annals-csis.org/proceedings/2023/drp/pdf/6019.pdf"
    doi: "https://doi.org/10.15439/2023F6019"
  abstract: "Neuro-symbolic integration of symbolic and subsymbolic techniques represents a fast-growing AI trend aimed at mitigating the issues of neural networks in terms of decision processes, reasoning, and interpretability.Several state-of-theart neuro-symbolic approaches aim at improving performance, most of them focusing on proving their effectiveness in terms of raw predictive performance and/or reasoning capabilities.Meanwhile, few efforts have been devoted to increasing model trustworthiness, interpretability, and efficiency-mostly due to the complexity of measuring effectively improvements in terms of trustworthiness and interpretability.This is why here we analyse and discuss the need for ad-hoc trustworthiness metrics for neurosymbolic techniques.We focus on two popular paradigms mixing subsymbolic computation and symbolic knowledge, namely: (i) symbolic knowledge extraction (SKE), aimed at mapping subsymbolic models into human-interpretable knowledge bases; and (ii) symbolic knowledge injection (SKI), aimed at forcing subsymbolic models to adhere to a given symbolic knowledge.We first emphasise the need for assessing neuro-symbolic approaches from a trustworthiness perspective, highlighting the research challenges linked with this evaluation and the need for ad-hoc trust definitions.Then we summarise recent developments in SKE and SKI metrics focusing specifically on several trustworthiness pillars such as interpretability, efficiency, and robustness of neuro-symbolic methods.Finally, we highlight open research opportunities towards reliable and flexible trustworthiness metrics for neuro-symbolic integration."
  bibtex: |-
    @inproceedings{keynote-fedcsis2023,
      title     = {Measuring Trustworthiness in Neuro-Symbolic Integration},
      author    = {Agiollo, Andrea and Omicini, Andrea},
      booktitle = {Proceedings of the 18th Conference on Computer Science and Intelligence Systems (FedCSIS)},
      series    = {Annals of Computer Science and Information Systems},
      volume    = {35},
      pages     = {1--10},
      year      = {2023},
      doi       = {10.15439/2023F6019}
    }

- id: woa2023
  type: workshop
  year: 2023
  topics: [distributed]
  keywords: ["Federated learning", "Non-IID data", "Convergence", "Model aggregation"]
  title: "Peer-Reviewed Federated Learning"
  authors: ["Mattia Passeri", "Andrea Agiollo", "Andrea Omicini"]
  venue: "WOA 2023"
  venue_full: "24th Workshop “From Objects to Agents”, CEUR Workshop Proceedings, vol. 3579"
  thumb: "/images/paper_thumbnails/woa2023_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "https://ceur-ws.org/Vol-3579/paper4.pdf"
    code: "https://github.com/passerim/peer-review-flower"
  abstract: "While representing the de-facto framework for enabling distributed training of Machine Learning models, Federated Learning (FL) still suffers convergence issues when non-Independent and Identically Distributed (non-IID) data are considered. In this context, the local model optimisation on different data distributions generate dissimilar updates, which are difficult to aggregate and translate into sub-optimal convergence. To tackle this issues, we propose Peer-Reviewed Federated Learning (PRFL), an extension of the traditional FL training process inspired by the peer-review procedure common in the academic field, where model updates are reviewed by several other clients in the federation before being aggregated at the server-side. PRFL aims at enabling the identification of relevant updates, while disregarding the ineffective ones. We implement PRFL on top of the Flower FL library, and make Peer-Reviewed Flower a publicly-available library for the modular implementation of any review-based FL algorithm. A preliminary case study on both regression and classification tasks highlights the potential of PRFL, showcasing how the distributed solution can achieve performance similar to that obtained by the corresponding centralised algorithm, even when non-IID data are considered."
  bibtex: |-
    @inproceedings{prfl-woa2023,
      title     = {Peer-Reviewed Federated Learning},
      author    = {Passeri, Mattia and Agiollo, Andrea and Omicini, Andrea},
      booktitle = {WOA 2023 -- 24th Workshop ``From Objects to Agents''},
      series    = {CEUR Workshop Proceedings},
      volume    = {3579},
      pages     = {49--65},
      year      = {2023},
      url       = {https://ceur-ws.org/Vol-3579/paper4.pdf}
    }

- id: extraamas2023
  type: workshop
  year: 2023
  topics: [neurosymbolic]
  keywords: ["Explainable AI", "Post-hoc explainers", "Large Language Models", "Natural language processing", "Moral values classification"]
  title: "The Quarrel of Local Post-hoc Explainers for Moral Values Classification in Natural Language Processing"
  authors: ["Andrea Agiollo", "Luciano Cavalcante Siebert", "Pradeep K. Murukannaiah", "Andrea Omicini"]
  venue: "EXTRAAMAS 2023"
  venue_full: "5th International Workshop on Explainable and Transparent AI and Multi-Agent Systems, Springer LNCS"
  thumb: "/images/paper_thumbnails/extraamas2023_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    code: "https://github.com/AndAgio/SKE_NLP"
    doi: "https://doi.org/10.1007/978-3-031-40878-6_6"
  abstract: "Although popular and effective, large language models (LLM) are characterised by a performance vs. transparency trade-off that hinders their applicability to sensitive scenarios. This is the main reason behind many approaches focusing on local post-hoc explanations recently proposed by the XAI community. However, to the best of our knowledge, a thorough comparison among available explainability techniques is currently missing, mainly for the lack of a general metric to measure their benefits. We compare state-of-the-art local post-hoc explanation mechanisms for models trained over moral value classification tasks based on a measure of correlation. By relying on a novel framework for comparing global impact scores, our experiments show how most local post-hoc explainers are loosely correlated, and highlight huge discrepancies in their results—their “quarrel” about explanations. Finally, we compare the impact scores distribution obtained from each local post-hoc explainer with human-made dictionaries, and point out that there is no correlation between explanation outputs and the concepts humans consider as salient."
  bibtex: |-
    @incollection{quarrel-extraamas2023,
      title     = {The Quarrel of Local Post-hoc Explainers for Moral Values Classification in Natural Language Processing},
      author    = {Agiollo, Andrea and Siebert, Luciano Cavalcante and Murukannaiah, Pradeep K. and Omicini, Andrea},
      booktitle = {Explainable and Transparent AI and Multi-Agent Systems (EXTRAAMAS 2023)},
      series    = {Lecture Notes in Computer Science},
      pages     = {97--115},
      year      = {2023},
      publisher = {Springer},
      doi       = {10.1007/978-3-031-40878-6_6}
    }

- id: uai2022
  type: conference
  year: 2022
  topics: [efficient]
  keywords: ["Graph Neural Networks", "Neural architecture generation", "Adversarial training", "Generative models"]
  title: "GNN2GNN: Graph Neural Networks to Generate Neural Networks"
  authors: ["Andrea Agiollo", "Andrea Omicini"]
  venue: "UAI 2022"
  venue_full: "38th Conference on Uncertainty in Artificial Intelligence, PMLR vol. 180"
  thumb: "/images/paper_thumbnails/uai2022_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    paper: "https://proceedings.mlr.press/v180/agiollo22a.html"
    pdf: "https://proceedings.mlr.press/v180/agiollo22a/agiollo22a.pdf"
    code: "https://github.com/AndAgio/GNN-2-GNN"
  abstract: "The success of neural networks (NNs) is tightly linked with their architectural design—a complex problem by itself. We here introduce a novel framework leveraging Graph Neural Networks to Generate Neural Networks (GNN2GNN) where powerful NN architectures can be learned out of a set of available architecture-performance pairs. GNN2GNN relies on a three-way adversarial training of GNN, to optimise a generator model capable of producing predictions about powerful NN architectures. Unlike Neural Architecture Search (NAS) techniques proposing efficient searching algorithms over a set of NN architec- tures, GNN2GNN relies on learning NN architectural design criteria. GNN2GNN learns to propose NN architectures in a single step – i.e., training of the generator –, overcoming the recursive approach characterising NAS. Therefore, GNN2GNN avoids the expensive and inflexible search of efficient structures typical of NAS approaches. Extensive experiments over two state-of-the-art datasets prove the strength of our framework, showing that it can generate powerful architectures with high probability. Moreover, GNN2GNN outperforms possible counterparts for generating NN architectures, and shows flexibility against dataset quality degradation. Finally, GNN2GNN paves the way towards generalisation between datasets."
  bibtex: |-
    @inproceedings{agiollo2022gnn2gnn,
      title     = {{GNN2GNN}: Graph Neural Networks to Generate Neural Networks},
      author    = {Agiollo, Andrea and Omicini, Andrea},
      booktitle = {Proceedings of the 38th Conference on Uncertainty in Artificial Intelligence (UAI)},
      series    = {Proceedings of Machine Learning Research},
      volume    = {180},
      pages     = {32--42},
      year      = {2022},
      publisher = {PMLR},
      url       = {https://proceedings.mlr.press/v180/agiollo22a.html}
    }

- id: woa2022
  type: workshop
  year: 2022
  topics: [neurosymbolic]
  keywords: ["Symbolic knowledge injection", "QoS metrics", "Sub-symbolic predictors", "Neuro-symbolic integration"]
  title: "Towards Quality-of-Service Metrics for Symbolic Knowledge Injection"
  authors: ["Andrea Agiollo*", "Andrea Rafanelli*", "Andrea Omicini"]
  equal: true
  venue: "WOA 2022"
  venue_full: "23rd Workshop “From Objects to Agents”, CEUR Workshop Proceedings, vol. 3261"
  thumb: "/images/paper_thumbnails/woa2022_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "https://ceur-ws.org/Vol-3261/paper3.pdf"
  abstract: "The integration of symbolic knowledge and sub-symbolic predictors represents a recent popular trend in AI. Among the set of integration approaches, Symbolic Knowledge Injection (SKI) proposes the exploitation of human-intelligible knowledge to steer sub-symbolic models towards some desired behaviour. The vast majority of works in the field of SKI aim at increasing the predictive performance of the sub-symbolic model at hand and, therefore, measure SKI strength solely based on performance improvements. However, a variety of artefacts exist that affect this measure, mostly linked to the quality of the injected knowledge and the underlying predictor. Moreover, the use of injection techniques introduces the possibility of producing more efficient sub-symbolic models in terms of computations, energy, and data required. Therefore, novel and reliable Quality-of-Service (QoS) measures for SKI are clearly needed, aiming at robustly identifying the overall quality of an injection mechanism. Accordingly, in this work, we propose and mathematically model the first – up to our knowledge – set of QoS metrics for SKI, focusing on measuring injection robustness and efficiency gain."
  bibtex: |-
    @inproceedings{agiollo2022towards,
      title     = {Towards Quality-of-Service Metrics for Symbolic Knowledge Injection},
      author    = {Agiollo, Andrea and Rafanelli, Andrea and Omicini, Andrea},
      booktitle = {WOA 2022 -- 23rd Workshop ``From Objects to Agents''},
      series    = {CEUR Workshop Proceedings},
      volume    = {3261},
      pages     = {30--47},
      year      = {2022},
      url       = {https://ceur-ws.org/Vol-3261/paper3.pdf}
    }

- id: tnsm2021
  type: journal
  year: 2021
  topics: [security]
  keywords: ["RPL routing attacks", "IoT security", "Intrusion detection", "Low-power lossy networks"]
  title: "DETONAR: Detection of Routing Attacks in RPL-based IoT"
  authors: ["Andrea Agiollo", "Mauro Conti", "Pallavi Kaliyar", "Tsung-Nan Lin", "Luca Pajola"]
  venue: "IEEE TNSM, 2021"
  venue_full: "IEEE Transactions on Network and Service Management, vol. 18, no. 2"
  thumb: "/images/paper_thumbnails/tnsm2021_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    code: "https://github.com/AndAgio/DETONAR"
    doi: "https://doi.org/10.1109/TNSM.2021.3075496"
  abstract: "The Internet of Things (IoT) is a reality that changes several aspects of our daily life, from smart home monitoring to the management of critical infrastructure. The “Routing Protocol for low power and Lossy networks” (RPL) is the only de-facto standardized routing protocol in IoT networks and is thus deployed in environmental monitoring, healthcare, smart building, and many other IoT applications. In literature, we can find several attacks aiming to affect and disrupt RPL-based networks. Therefore, it is fundamental to develop security mechanisms that detect and mitigate any potential attack in RPL-based networks. Current state-of-the-art security solutions deal with very few attacks while introducing heavy mechanisms at the expense of IoT devices and the overall network performance. In this work, we aim to develop an Intrusion Detection System (IDS) capable of dealing with multiple attacks while avoiding any RPL overhead. The proposed system is called DETONAR - DETector of rOutiNg Attacks in Rpl - and it relies on a packet sniffing approach. DETONAR uses a combination of signature and anomaly-based rules to identify any malicious behavior in the traffic (e.g., application and DIO packets). To the best of our knowledge, there are no exhaustive datasets containing RPL traffic for a vast range of attacks. To overcome this issue and evaluate our IDS, we propose RADAR - Routing Attacks DAtaset for Rpl: the dataset contains five simulations for each of the 14 considered attacks in 16 static-nodes networks. DETONAR’s attack detection exceeds 80% for 10 attacks out of 14, while maintaining false positives close to zero."
  bibtex: |-
    @article{detonar-ieetnsm2021,
      title     = {{DETONAR}: Detection of Routing Attacks in {RPL}-based {IoT}},
      author    = {Agiollo, Andrea and Conti, Mauro and Kaliyar, Pallavi and Lin, Tsung-Nan and Pajola, Luca},
      journal   = {IEEE Transactions on Network and Service Management},
      volume    = {18},
      number    = {2},
      pages     = {1178--1190},
      year      = {2021},
      publisher = {IEEE},
      doi       = {10.1109/TNSM.2021.3075496}
    }

- id: applsci2021
  type: journal
  year: 2021
  topics: [efficient]
  keywords: ["Embedded AI", "Resource-constrained devices", "Neural networks", "Load classification"]
  title: "Load Classification: A Case Study for Applying Neural Networks in Hyper-Constrained Embedded Devices"
  authors: ["Andrea Agiollo", "Andrea Omicini"]
  venue: "Applied Sciences, 2021"
  venue_full: "MDPI Applied Sciences, vol. 11, no. 24"
  thumb: "/images/paper_thumbnails/applsci2021_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "/files/papers/applsci2021.pdf"
    doi: "https://doi.org/10.3390/app112411957"
  abstract: "The application of Artificial Intelligence to the industrial world and its appliances has recently grown in popularity. Indeed, AI techniques are now becoming the de-facto technology for the resolution of complex tasks concerning computer vision, natural language processing and many other areas. In the last years, most of the the research community efforts have focused on increasing the performance of most common AI techniques—e.g., Neural Networks, etc.—at the expenses of their complexity. Indeed, many works in the AI field identify and propose hyper-efficient techniques, targeting high-end devices. However, the application of such AI techniques to devices and appliances which are characterised by limited computational capabilities, remains an open research issue. In the industrial world, this problem heavily targets low-end appliances, which are developed focusing on saving costs and relying on—computationally—constrained components. While some efforts have been made in this area through the proposal of AI-simplification and AI-compression techniques, it is still relevant to study which available AI techniques can be used in modern constrained devices. Therefore, in this paper we propose a load classification task as a case study to analyse which state-of-the-art NN solutions can be embedded successfully into constrained industrial devices. The presented case study is tested on a simple microcontroller, characterised by very poor computational performances—i.e., FLOPS –, to mirror faithfully the design process of low-end appliances. A handful of NN models are tested, showing positive outcomes and possible limitations, and highlighting the complexity of AI embedding."
  bibtex: |-
    @article{nnconstrained-applsci11,
      title     = {Load Classification: A Case Study for Applying Neural Networks in Hyper-Constrained Embedded Devices},
      author    = {Agiollo, Andrea and Omicini, Andrea},
      journal   = {Applied Sciences},
      volume    = {11},
      number    = {24},
      pages     = {11957},
      year      = {2021},
      publisher = {MDPI},
      doi       = {10.3390/app112411957}
    }

- id: woa2021
  type: workshop
  year: 2021
  topics: [neurosymbolic]
  keywords: ["Graph Neural Networks", "Computational logic", "Knowledge representation", "Neuro-symbolic integration", "Roadmap"]
  title: "Graph Neural Networks as the Copula Mundi between Logic and Machine Learning: A Roadmap"
  authors: ["Andrea Agiollo", "Giovanni Ciatto", "Andrea Omicini"]
  venue: "WOA 2021"
  venue_full: "22nd Workshop “From Objects to Agents”, CEUR Workshop Proceedings, vol. 2963"
  thumb: "/images/paper_thumbnails/woa2021_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "https://ceur-ws.org/Vol-2963/paper18.pdf"
  abstract: "Combining machine learning (ML) and computational logic (CL) is hard, mostly because of the inherently- different ways they use to represent knowledge. In fact, while ML relies on fixed-size numeric repre- sentations leveraging on vectors, matrices, or tensors of real numbers, CL relies on logic terms and clauses—which are unlimited in size and structure. Graph neural networks (GNN) are a novelty in the ML world introduced for dealing with graph- structured data in a sub-symbolic way. In other words, GNN pave the way towards the application of ML to logic clauses and knowledge bases. However, there are several ways to encode logic knowledge into graphs: which is the best one heavily depends on the specific task at hand. Accordingly, in this paper, we (i) elicit a number of problems from the field of CL that may benefit from many graph-related problems where GNN has been proved effective; (ii) exemplify the application of GNN to logic theories via an end-to-end toy example, to demonstrate the many intricacies hidden behind the technique; (iii) discuss the possible future directions of the application of GNN to CL in general, pointing out opportunities and open issues."
  bibtex: |-
    @inproceedings{gnn-woa2021,
      title     = {Graph Neural Networks as the Copula Mundi between Logic and Machine Learning: A Roadmap},
      author    = {Agiollo, Andrea and Ciatto, Giovanni and Omicini, Andrea},
      booktitle = {WOA 2021 -- 22nd Workshop ``From Objects to Agents''},
      series    = {CEUR Workshop Proceedings},
      volume    = {2963},
      pages     = {98--115},
      year      = {2021},
      url       = {https://ceur-ws.org/Vol-2963/paper18.pdf}
    }

- id: extraamas2021
  type: workshop
  year: 2021
  topics: [neurosymbolic, efficient]
  keywords: ["Explainable AI", "Neural architecture search", "Neural network opacity", "Interpretability"]
  title: "Shallow2Deep: Restraining Neural Networks Opacity through Neural Architecture Search"
  authors: ["Andrea Agiollo", "Giovanni Ciatto", "Andrea Omicini"]
  venue: "EXTRAAMAS 2021"
  venue_full: "3rd International Workshop on Explainable and Transparent AI and Multi-Agent Systems, Springer LNCS"
  thumb: "/images/paper_thumbnails/extraamas2021_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    code: "https://github.com/AndAgio/Shallow2Deep"
    doi: "https://doi.org/10.1007/978-3-030-82017-6_5"
  abstract: "Recently, the Deep Learning (DL) research community has focused on developing efficient and highly performing Neural Networks (NN). Meanwhile, the eXplainable AI (XAI) research community has focused on making Machine Learning (ML) and Deep Learning methods interpretable and transparent, seeking explainability. This work is a preliminary study on the applicability of Neural Architecture Search (NAS) (a sub-field of DL looking for automatic design of NN structures) in XAI. We propose Shallow2Deep, an evolutionary NAS algorithm that exploits local variability to restrain opacity of DL-systems through NN architectures simplification. Shallow2Deep effectively reduces NN complexity – therefore their opacity – while reaching state-of-the-art performances. Unlike its competitors, Shallow2Deep promotes variability of localised structures in NN, helping to reduce NN opacity. The proposed work analyses the role of local variability in NN architectures design, presenting experimental results that show how this feature is actually desirable."
  bibtex: |-
    @incollection{shallow2deep-extraamas2021,
      title     = {{Shallow2Deep}: Restraining Neural Networks Opacity through Neural Architecture Search},
      author    = {Agiollo, Andrea and Ciatto, Giovanni and Omicini, Andrea},
      booktitle = {Explainable and Transparent AI and Multi-Agent Systems (EXTRAAMAS 2021)},
      series    = {Lecture Notes in Computer Science},
      pages     = {63--82},
      year      = {2021},
      publisher = {Springer},
      doi       = {10.1007/978-3-030-82017-6_5}
    }

- id: icdsc2019
  type: conference
  year: 2019
  topics: [efficient]
  keywords: ["Computer vision", "RGB-D segmentation", "Region merging", "Convolutional neural networks", "Semantic labeling"]
  title: "Region Merging Driven by Deep Learning for RGB-D Segmentation and Labeling"
  authors: ["Umberto Michieli", "Maria Camporese", "Andrea Agiollo", "Giampaolo Pagnutti", "Pietro Zanuttigh"]
  venue: "ICDSC 2019"
  venue_full: "13th International Conference on Distributed Smart Cameras, ACM"
  thumb: "/images/paper_thumbnails/icdsc2019_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    doi: "https://doi.org/10.1145/3349801.3349810"
  abstract: "Among the various segmentation techniques, a widely used family of approaches are the ones based on region merging, where an initial oversegmentation is progressively refined by joining segments with similar characteristics. Instead of using deterministic approaches to decide which segments are going to be merged we propose to exploit a convolutional neural network which takes a couple of segments as input and decides whether to join or not the segments. We fitted this idea into an existent iterative semantic segmentation scheme for RGB-D data. We were able to lower the number of free parameters and to greatly speedup the procedure while achieving comparable or even higher results, thus allowing for its usage in free navigation systems. Furthermore, our method could be extended straightforwardly to other fields where region merging strategies are exploited."
  bibtex: |-
    @inproceedings{rgbdsemanticsegmentation-icdsc2019,
      title     = {Region Merging Driven by Deep Learning for {RGB-D} Segmentation and Labeling},
      author    = {Michieli, Umberto and Camporese, Maria and Agiollo, Andrea and Pagnutti, Giampaolo and Zanuttigh, Pietro},
      booktitle = {Proceedings of the 13th International Conference on Distributed Smart Cameras (ICDSC)},
      pages     = {9:1--9:6},
      year      = {2019},
      publisher = {ACM},
      doi       = {10.1145/3349801.3349810}
    }
