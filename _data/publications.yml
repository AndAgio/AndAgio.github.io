    @inproceedings{KimIclr2026,
      title     = {Membership Privacy Risks of Sharpness Aware Minimization},
      author    = {Kim, Young In and Agiollo, Andrea and Agrawal, Pratiksha and Royset, Johannes O. and Khanna, Rajiv},
      booktitle = {International Conference on Learning Representations (ICLR)},
      year      = {2026}
    }

- id: agents2026
  type: chapter
  year: 2026
  topics: [neurosymbolic]
  keywords: ["Intelligent agents", "Multi-agent systems", "Neuro-symbolic integration", "Symbolic reasoning"]
  title: "Intelligent Agents from Symbolic to Neurosymbolic Systems: The Quest for Integration"
  authors: ["Andrea Agiollo", "Roberta Calegari", "Giovanni Ciatto", "Matteo Magnini", "Andrea Omicini", "Federico Sabbatini"]
  venue: "Book chapter, 2026"
  venue_full: "The Agents Journey: Twenty-Five Years of Multi-agent Systems, Springer"
  thumb: "/images/paper_thumbnails/agents2026_thumb.jpg"
  thumb_alt: "First page of the paper"
  links:
    pdf: "https://link.springer.com/content/pdf/10.1007/978-3-032-22940-3_12.pdf"
    doi: "https://doi.org/10.1007/978-3-032-22940-3_12"
  abstract: "In this chapter we take as our reference twenty-five years of scientific and technical results presented at the Workshop on Objects, and explore the development of rational agents and integration with machine learning (ML) techniques, discussing their transition from pure symbolic to subsymbolic and neurosymbolic systems. Given the growing importance of combining rational agent reasoning with ML, we first outline the current state of technology by highlighting key milestones and breakthroughs. Pinpointing logics and logic programming as the main foundational tool for the design and implementation of rational agents, we discuss successful implementations and applications of logic-based agents , then we identify some of the main integration strands of subsymbolic techniques within rational agents. In particular, we focus on symbolic knowledge injection (SKI) and symbolic knowledge extraction (SKE) as some of the most relevant neurosymbolic techniques, and on their impact on intelligent agents and multi-agent systems (MASs). Current gaps and challenges in the integration of rational agents with ML are finally discussed along with future research directions."
